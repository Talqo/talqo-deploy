name: talqo

services:
  app:
    image: ghcr.io/talqo/talqo:${TALQO_VERSION}
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://talqo:${POSTGRES_PASSWORD}@postgres:5432/talqo
      TALQO_DOCLING_URL: http://docling:5001
    ports:
      - target: 3000
        host_ip: 127.0.0.1
        published: ${TALQO_PORT:-3000}
    volumes:
      - uploads:/data/uploads

  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    restart: always
    environment:
      POSTGRES_DB: talqo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: talqo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      start_interval: 1s
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3
    shm_size: 128mb
    volumes:
      - postgres-data:/var/lib/postgresql

  docling:
    image: quay.io/docling-project/docling-serve-cpu:v1.35.0
    restart: always

volumes:
  postgres-data:
  uploads:
