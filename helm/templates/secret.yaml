{{- if eq .Values.existingSecret "" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "talqo.secretName" . }}
  labels:
    {{- include "talqo.labels" . | nindent 4 }}
type: Opaque
data:
  # data (not stringData) so rendered manifests never contain plaintext secrets.
  APP_SECRET: {{ required "Set appSecret or existingSecret before installing. See helm/README.md." .Values.appSecret | b64enc | quote }}
  {{- if .Values.postgresql.enabled }}
  # Password must stay URL-safe: the database ignores changes after first
  # start, so a rotated value locks the app out instead of updating the DB.
  DATABASE_URL: {{ printf "postgres://%s:%s@%s:5432/%s" .Values.postgresql.auth.username (required "Set postgresql.auth.password or existingSecret before installing. See helm/README.md." .Values.postgresql.auth.password) (include "talqo.postgresqlHost" .) .Values.postgresql.auth.database | b64enc | quote }}
  {{- else }}
  DATABASE_URL: {{ required "Set externalDatabase.url when postgresql.enabled=false. See helm/README.md." .Values.externalDatabase.url | b64enc | quote }}
  {{- end }}
{{- end }}
